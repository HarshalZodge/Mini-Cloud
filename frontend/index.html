<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cloud.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniCloud — Private LAN Cloud Storage</title>
  </head>
  <body class="min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200">
    <!-- Fixed Ambient Glow Orbs Backdrop -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden bg-gradient-to-br from-indigo-50 via-sky-50 to-violet-100 dark:from-slate-950 dark:via-indigo-950/40 dark:to-slate-900">
      <!-- Glow Orb 1 (Indigo) -->
      <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-400/25 dark:bg-indigo-600/20 blur-3xl"></div>
      <!-- Glow Orb 2 (Cyan) -->
      <div class="absolute top-1/3 -right-32 w-[32rem] h-[32rem] rounded-full bg-cyan-400/20 dark:bg-sky-500/15 blur-3xl"></div>
      <!-- Glow Orb 3 (Violet) -->
      <div class="absolute -bottom-32 left-1/4 w-[30rem] h-[30rem] rounded-full bg-violet-400/20 dark:bg-violet-600/15 blur-3xl"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
